<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сайт</title>
<meta name="description" content="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <strong id="brand"></strong>
    <a class="btn btn-small" id="wa-top" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="kicker" id="city"></p>
      <h1 id="title"></h1>
      <p class="lead" id="about"></p>
      <div class="actions">
        <a class="btn" id="wa-hero" target="_blank" rel="noopener">WhatsApp арқылы жазу</a>
        <a class="btn btn-ghost" id="tg-hero" target="_blank" rel="noopener">Telegram-бот</a>
      </div>
    </div>
  </section>

  <section class="block" id="services-block">
    <div class="wrap">
      <h2>Қызметтер</h2>
      <div class="cards" id="services"></div>
    </div>
  </section>

  <section class="block tint" id="prices-block">
    <div class="wrap">
      <h2>Бағалар</h2>
      <ul class="prices" id="prices"></ul>
    </div>
  </section>

  <section class="block" id="reviews-block">
    <div class="wrap">
      <h2>Пікірлер</h2>
      <div class="cards" id="reviews"></div>
    </div>
  </section>

  <section class="block tint">
    <div class="wrap contact">
      <h2>Байланыс</h2>
      <p id="address"></p>
      <p id="hours"></p>
      <div class="actions">
        <a class="btn" id="wa-bottom" target="_blank" rel="noopener">WhatsApp арқылы жазу</a>
        <a class="btn btn-ghost" id="tg-bottom" target="_blank" rel="noopener">Telegram-бот</a>
      </div>
    </div>
  </section>
</main>

<footer class="wrap foot"><span id="foot"></span></footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
